<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./assets/js/script.js" defer></script>
    <title>weather app</title>
  </head>

  <body>
    <main id="main-container">
      <section id="main-section">
        <a href="#">
          <img src="./assets/media/icons/logo.svg" alt="weather app logo" />
        </a>
        <div id="weather-main-info">
          <h1></h1>
          <div class="searched_location_weather_info">
            <h2></h2>
            <span></span>
          </div>
          <!--here must be an icon that represents the searched cities current weather-->
          <img src="" alt="" />
        </div>
      </section>
      <div id="blur-background"></div>
      <aside>
        <form action="/" class="search-form">
          <input
            type="search"
            id="search-input"
            placeholder="Search location..."
            autofocus
          />
          <button type="submit" id="search-button">
            <img src="./assets/media/icons/search icon.svg" alt="search icon" />
          </button>
        </form>
        <div id="weather-details">
          <h2>Weather Details</h2>
          <div class="current-weather-details">
            <div class="current-weather-text-container">
              <p class="current-weather-text"></p>
            </div>
            <div class="current-weather-info">
              <p>Temp max</p>
              <span></span>
              <img
                src="./assets/media/icons/temp-max.svg"
                alt="max temperature icon"
              />
            </div>
            <div class="current-weather-info">
              <p>Temp min</p>
              <span></span>
              <img
                src="./assets/media/icons/temp-min.svg"
                alt="min temperature icon"
              />
            </div>
            <div class="current-weather-info">
              <p>Humidity</p>
              <span></span>
              <img
                src="./assets/media/icons/humadity.svg"
                alt="humidity icon"
              />
            </div>
            <div class="current-weather-info">
              <p>Cloudy</p>
              <span></span>
              <img src="./assets/media/icons/cloudy.svg" alt="cloudy icon" />
            </div>
            <div class="current-weather-info">
              <p>Wind</p>
              <span></span>
              <img src="./assets/media/icons/wind.svg" alt="wind icon" />
            </div>
          </div>
        </div>
        <div class="long-term-weather-details">
          <h2></h2>
          <div class="next-days-weather-info">
            <h2>Weather Forecast</h2>
            <div class="week-days">
              <div>
                <h3>Today</h3>
                <span></span>
                <img src="" alt="" />
              </div>
              <div>
                <h3>Today</h3>
                <span></span>
                <img src="" alt="" />
              </div>
              <div>
                <h3>Today</h3>
                <span></span>
                <img src="" alt="" />
              </div>
              <div>
                <h3>Today</h3>
                <span></span>
                <img src="" alt="" />
              </div>
              <div>
                <h3>Today</h3>
                <span></span>
                <img src="" alt="" />
              </div>
              <div>
                <h3>Today</h3>
                <span></span>
                <img src="" alt="" />
              </div>
              <div>
                <h3>Today</h3>
                <span></span>
                <img src="" alt="" />
              </div>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
